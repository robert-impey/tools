name: Rust

on:
  push:
    branches:
      - "dev"
      - "prod"

env:
  CARGO_TERM_COLOR: always

jobs:
  build_tidy_folder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tidy_folder
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
